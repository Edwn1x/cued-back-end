name: tier1

# Tier-1 eval harness: deterministic, LLM-mocked, no secrets. Tier-2 (live,
# metered) is intentionally NOT run here — it needs a funded key and stays a
# local/deliberate action. We invoke tests/tier1 explicitly so tier-2 can never
# be pulled into CI by accident.

on:
  push:
  pull_request:

jobs:
  tier1:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cued
          POSTGRES_PASSWORD: cued
          POSTGRES_DB: cued_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cued"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway test DB (service container), never prod. No API keys here.
      CUED_TEST_DATABASE_URL: postgresql://cued:cued@localhost:5432/cued_test
      ANTHROPIC_API_KEY: sk-ant-dummy-ci
      TWILIO_ACCOUNT_SID: ACdummy
      TWILIO_AUTH_TOKEN: dummytoken
      TWILIO_PHONE_NUMBER: "+15550000000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # lxml 5.2.2 (pinned in requirements.txt) has no cp313 wheel, so pip builds
      # it from sdist and needs the libxml2/libxslt dev headers. Installing them
      # here keeps requirements.txt untouched for Phase 0 (additive only).
      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tier-1 suite
        run: python -m pytest tests/tier1 -rA
